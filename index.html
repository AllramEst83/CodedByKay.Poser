<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pose Reference Tool</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1b1f; overflow: hidden; }
      #app { position: relative; width: 100%; height: 100%; }
      canvas { display: block; touch-action: none; }
      #hint {
        position: absolute; left: 12px; bottom: 12px; color: #ddd;
        font: 12px/1.4 system-ui, sans-serif; opacity: 0.7; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">Drag to orbit &middot; click a joint to select it &middot; Ctrl+Z / Ctrl+Shift+Z to undo/redo</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
